  <text class="sub" x="64" y="108"><tspan x="64" dy="0">A retrieval-augmented operator knowledge graph that turns long-form talks into</tspan><tspan x="64" dy="22">clickable, citable, searchable advice and links each lesson to the evidence that</tspan></text>
